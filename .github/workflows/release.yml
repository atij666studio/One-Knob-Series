name: Release

# Push a tag like v1.0.0 to build every platform and publish a GitHub Release:
#   - one zip per plug-in per platform (VST3 + CLAP + LV2 [+ AU] + manual)
#   - Windows: ONE-KNOB-Series-v<ver>-Windows-x64-Setup.exe  (tick the plug-ins/formats you want)
#   - macOS:   ONE-KNOB-Series-v<ver>-macOS-Installer.pkg    (Customize: tick the plug-ins/formats)
#   - Linux:   ONE-KNOB-Series-v<ver>-Linux-<arch>.tar.gz    (install.sh asks what to install)
#   - ONE-KNOB-Series-v<ver>-Manual.pdf (all 23 manuals in one)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress
      - name: Build all plug-ins
        shell: pwsh
        run: ./packaging/build-all.ps1
      - name: Package
        shell: pwsh
        run: |
          $V = "${{ github.ref_name }}".TrimStart("v")
          $out = New-Item -ItemType Directory -Force dist/release
          Get-ChildItem dist/stage -Directory | ForEach-Object {
            Compress-Archive -Path "$($_.FullName)\*" -DestinationPath "$out\$($_.Name)-v$V-Windows-x64.zip"
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$V" "/DRootDir=$PWD" "/DStageDir=$PWD\dist\stage" "/DOutDir=$out" packaging\windows\ONE-KNOB-Series.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem $out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/release/*

  macos:
    name: macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - name: "Build all plug-ins (Universal: Apple Silicon + Intel)"
        run: bash packaging/build-all.sh -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Package
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist/release
          for d in dist/stage/*/; do
            p=$(basename "$d")
            (cd "$d" && zip -qry "../../release/$p-v$V-macOS.zip" .)
          done
          bash packaging/macos/build-pkg.sh "$V" dist/stage dist/release
          ls -l dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/release/*

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04,     arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: ARM64 }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build build-essential pkg-config git zip gcc-12 g++-12 \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxext-dev libgtk-3-dev
      - name: Build all plug-ins
        run: bash packaging/build-all.sh -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12
      - name: Package
        run: |
          V="${GITHUB_REF_NAME#v}"; A="${{ matrix.arch }}"
          mkdir -p dist/release
          for d in dist/stage/*/; do
            p=$(basename "$d")
            (cd "$d" && zip -qry "../../release/$p-v$V-Linux-$A.zip" .)
          done
          B="ONE-KNOB-Series-v$V-Linux-$A"
          mkdir -p "dist/$B/VST3" "dist/$B/CLAP" "dist/$B/LV2" "dist/$B/Manuals"
          for d in dist/stage/*/; do
            cp -r "$d"VST3/* "dist/$B/VST3/"; cp "$d"CLAP/* "dist/$B/CLAP/"; cp -r "$d"LV2/* "dist/$B/LV2/"
            cp "$d"*-Manual.pdf "dist/$B/Manuals/"
          done
          cp docs/ONE-KNOB-Series-Manual.pdf "dist/$B/Manuals/"
          cp packaging/linux/install.sh LICENSE "dist/$B/"
          chmod +x "dist/$B/install.sh"
          tar -C dist -czf "dist/release/$B.tar.gz" "$B"
          ls -l dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/release/*

  publish:
    name: Publish release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Add the combined manual
        run: |
          cp docs/ONE-KNOB-Series-Manual.pdf "release/ONE-KNOB-Series-${GITHUB_REF_NAME}-Manual.pdf"
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          name: ONE KNOB Series ${{ github.ref_name }}
          body_path: packaging/RELEASE_NOTES.md
          make_latest: true
          files: release/*
